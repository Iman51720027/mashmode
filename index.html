<!DOCTYPE html>
<html lang="en">
<head>
    <!-- font assome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- css link -->
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mashmodes</title>
</head>
<body>

    <!-- mashmods heading -->
    <div class="mashmodsHeading">
        <h1 id="heading">mashmodes</h1>
    </div>
    <div class="gear-class">
        <!-- icon -->
        <i class="fa-sharp fa-solid fa-gear" id="settings"></i>
        
    </div>
    <!-- back button -->
    <button id="back">BACK</button>
    <!-- upload image -->
    
    <div class="app">

    <input
        type="file"
        id="galleryInput"
        accept=".apk"
    >

    <button id="upload-button" onclick="openGallery()">upload</button>

    </div>
    <!-- uplolad button -->
    <hr class="head-line-ar" id="addLine">
    <!-- hr line -->
    <p class="upload-message">empty</p>
    <div id="preview"></div>
    
    <!-- settings ui -->
    <div id="settings-ui">
        <h1>settings ui</h1>
        <hr class="unline">
        <p id="acounts"><i class="fa-solid fa-circle-user"></i>acount</p>
        <hr>
    </div>
    <script type="text/javascript" charset="utf-8" src="script.js">
        
    </script>
</body>
</html>
